name: Private daily backlog backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: private-backlog-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
          BACKUP_REPOSITORY: ${{ secrets.BACKUP_REPOSITORY }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
